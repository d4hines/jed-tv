name = "Mp4Test"
defaultTargets = ["Mp4Test", "transcript"]

# Only the library modules under test are compiled, into this package
# (srcDir ../..), not all of Yt as a [[require]]d package.
[[lean_lib]]
name = "Yt"
srcDir = "../../../../src/lean/yt"
globs = ["Yt.Json.Fmt", "Yt.Mp4.+"]

[[lean_lib]]
name = "Mp4Test"

[[lean_exe]]
name = "transcript"
root = "Main"

[[lean_exe]]
name = "bench"
root = "Bench"
