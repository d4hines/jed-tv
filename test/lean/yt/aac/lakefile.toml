name = "AacTest"
defaultTargets = ["AacFixture", "AacTest", "transcript", "aacdec", "aacfuzz", "aacinit"]

[[require]]
name = "Yt"
path = "../../../../src/lean/yt"

# Generated by tools/lean/yt/Fixtures.lean (aac): ADTS frames as hex, git-ignored.
[[lean_lib]]
name = "AacFixture"
srcDir = "../../../../assets/build/lean-aac/fixture"

[[lean_lib]]
name = "AacTest"

# Transcript (host side of zr-build transcript).
[[lean_exe]]
name = "transcript"
root = "Main"

# Host-only tool: decode an ADTS file, time it, compare with FFmpeg's output.
[[lean_exe]]
name = "aacdec"
root = "AacDec"

# Host-only: decode corrupted and random access units (must not panic or hang).
[[lean_exe]]
name = "aacfuzz"
root = "AacFuzz"

[[lean_exe]]
name = "aacinit"
root = "AacInitTime"
