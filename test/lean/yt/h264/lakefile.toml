name = "H264Test"
defaultTargets = ["h264dec", "h264compare", "h264clips", "h264fixture", "H264Fixture", "H264Test", "transcript"]

[[require]]
name = "Yt"
path = "../../../../src/lean/yt"

# Host tool: decode the first samples of an MP4 with the Lean H.264 decoder,
# write the frames as raw yuv420p (cropped) for comparison with FFmpeg
# (h264compare); --parse for the syntax only.
[[lean_exe]]
name = "h264dec"
root = "Main"

# Host tool: compare the Lean decoder's frames with FFmpeg's on the same samples.
[[lean_exe]]
name = "h264compare"
root = "Compare"

# Host tools: the libx264 feature clips (generated, then compared), and the
# transcript fixture below.
[[lean_exe]]
name = "h264clips"
root = "Clips"

[[lean_exe]]
name = "h264fixture"
root = "GenFixture"

# Generated by `lake exe h264fixture` (short MP4s as hex), git-ignored.
[[lean_lib]]
name = "H264Fixture"
srcDir = "../../../../assets/build/lean-h264/fixture"

[[lean_lib]]
name = "H264Test"

# Host-only tools (FFmpeg, upstream Lean's IO); ARM builds skip Host/.
[[lean_lib]]
name = "Host"

# Transcript (host side of zr-build transcript).
[[lean_exe]]
name = "transcript"
root = "TranscriptMain"
