[package]
name = "ytplay"
version = "0.1.0"
edition = "2021"
description = "Minimal YouTube player; runs as PID 1 on Linux (QEMU virt or the TV)"

[dependencies]
libc = "0.2"
serde_json = "1"
mp4 = { path = "../mp4" }
platform = { path = "../platform" }
md-5 = "0.10"
font8x8 = { version = "0.3", default-features = false }
# Thumbnails for search results (pure Rust JPEG decoder).
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }
# TLS crypto in pure Rust (RustCrypto), replacing ring's C and assembly.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
webpki-roots = "1"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
# H.264: FFmpeg's decoder translated to Rust by c2rust, NEON assembly kept.
ffh264 = { path = "../ffh264" }

