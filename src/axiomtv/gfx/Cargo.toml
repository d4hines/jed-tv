[package]
name = "axiomgfx"
version = "0.1.0"
edition = "2021"
description = "Platform layer for Axiom: First Light on the TV. Replaces Raylib: a software rasterizer into a 320x180 frame, the display, the remote and audio, behind a plain C ABI called from Lean"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
font8x8 = { version = "0.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
platform = { path = "../../platform" }
