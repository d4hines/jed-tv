# Feasibility probe (not part of the nolibc workspace): does sunfishcode's
# origin (program + thread startup in Rust, on rustix) build on STABLE 1.92
# for our targets, including 32-bit ARM?
[package]
name = "probe-origin"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
origin = { version = "0.26.2", default-features = false, features = [
    "origin-start", "thread", "alloc", "signal", "init-fini-arrays",
    "program-at-exit", "thread-at-exit", "panic-handler-trap", "eh-personality-continue",
] }

[profile.release]
panic = "abort"
lto = true

[workspace]
